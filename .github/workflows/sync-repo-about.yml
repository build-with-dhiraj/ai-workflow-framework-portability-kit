name: Sync repo About

on:
  push:
    branches: [main]
    paths:
      - 'Agents/**'
      - 'Skills/**'
      - 'Tooling/sync-repo-about.sh'
      - '.github/workflows/sync-repo-about.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update GitHub About description
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: bash Tooling/sync-repo-about.sh
